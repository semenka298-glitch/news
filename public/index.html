<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лента новостей</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1b1b1f; --muted: #6b6b76; --line: #e4e2dc; --accent: #c8341f; --chip: #ece9e2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131316; --card: #1c1c21; --text: #ececf0; --muted: #9a9aa6; --line: #2c2c33; --accent: #ff6a52; --chip: #2a2a31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 12px 0; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .grow { flex: 1; }
  input[type=search] { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; width: 240px; max-width: 100%; }
  button { font: inherit; cursor: pointer; }
  .iconbtn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 12px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: thin; }
  .tab { border: 0; background: var(--chip); color: var(--text); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  .tab small { color: var(--muted); margin-left: 4px; }
  .tab.active { background: var(--accent); color: #fff; }
  .tab.active small { color: #ffffffbb; }
  main { padding: 20px 0 60px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; height: 170px; object-fit: cover; background: var(--chip); }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .cat { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; display: flex; justify-content: space-between; }
  .cat time { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 400; }
  .card h2 { font-size: 17px; line-height: 1.3; margin: 0; }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { color: var(--accent); }
  .desc { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .srcs { margin-top: auto; padding-top: 6px; font-size: 13px; color: var(--muted); }
  .srcs a { color: var(--muted); }
  .srcs a:hover { color: var(--accent); }
  .more { display: block; margin: 28px auto 0; padding: 10px 28px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); max-width: 560px; width: calc(100% - 32px); padding: 20px; }
  dialog::backdrop { background: #0008; }
  .srclist { columns: 2; font-size: 14px; padding: 0; list-style: none; }
  .srclist li { break-inside: avoid; padding: 2px 0; }
  .ok { color: #2a9d4b; } .bad { color: #c0392b; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Лента<span>.</span>новостей</h1>
      <div class="grow"></div>
      <input type="search" id="q" placeholder="Поиск по новостям…">
      <button class="iconbtn" id="refresh" title="Обновить">↻</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <div class="meta" id="meta"></div>
  <div class="grid" id="grid"></div>
  <button class="iconbtn more" id="more" hidden>Показать ещё</button>
</main>
<dialog id="dlg"><h3 style="margin-top:0">Источники</h3><div id="dlgbody"></div><form method="dialog"><button class="iconbtn">Закрыть</button></form></dialog>

<script>
const PAGE = 48;
let category = 'all', query = '', offset = 0, loading = false;
const $ = (id) => document.getElementById(id);

function ago(ts) {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'только что';
  if (m < 60) return `${m} мин назад`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} ч назад`;
  return new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function card(n) {
  const others = n.sources.slice(1);
  const srcHtml = `<a href="${esc(n.sources[0].link)}" target="_blank" rel="noopener">${esc(n.sources[0].name)}</a>` +
    (others.length ? ` · также: ${others.map((s) => `<a href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(', ')}` : '');
  return `<article class="card">
    ${n.image ? `<img loading="lazy" src="${esc(n.image)}" alt="" onerror="this.remove()">` : ''}
    <div class="body">
      <div class="cat"><span>${esc(n.category)}</span><time>${ago(n.ts)}</time></div>
      <h2><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></h2>
      ${n.desc ? `<div class="desc">${esc(n.desc)}</div>` : ''}
      <div class="srcs">${srcHtml}</div>
    </div></article>`;
}

let DATA = null, filtered = [];
async function fetchData() {
  try { DATA = await (await fetch('news.json?_=' + Date.now())).json(); } catch { DATA = null; }
}
function load(reset) {
  if (!DATA) { $('grid').innerHTML = '<div class="empty">Загружаем новости…</div>'; return; }
  if (reset) {
    offset = 0;
    $('grid').innerHTML = '';
    const q = query.toLowerCase().trim();
    const base = q ? DATA.news.filter((n) => (n.title + ' ' + n.desc).toLowerCase().includes(q)) : DATA.news;
    const counts = {};
    for (const n of base) counts[n.category] = (counts[n.category] || 0) + 1;
    filtered = category === 'all' ? base : base.filter((n) => n.category === category);
    $('tabs').innerHTML = [['all', 'Все', base.length], ...DATA.categories.map((c) => [c, c, counts[c] || 0])]
      .map(([k, label, cnt]) => `<button class="tab ${k === category ? 'active' : ''}" data-k="${k}">${label}<small>${cnt}</small></button>`).join('');
  }
  const part = filtered.slice(offset, offset + PAGE);
  $('grid').insertAdjacentHTML('beforeend', part.map(card).join(''));
  offset += part.length;
  $('more').hidden = offset >= filtered.length;
  if (!filtered.length) $('grid').innerHTML = '<div class="empty">Ничего не найдено</div>';
  $('meta').innerHTML = `Найдено ${filtered.length} уникальных новостей · обновлено ${ago(DATA.updatedAt)} · <a href="#" id="srcs">источники</a>`;
}

$('tabs').onclick = (e) => { const b = e.target.closest('.tab'); if (b) { category = b.dataset.k; load(true); } };
$('more').onclick = () => load(false);
let t; $('q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { query = e.target.value; load(true); }, 300); };
$('refresh').onclick = async () => { await fetchData(); load(true); };
$('meta').onclick = (e) => {
  if (e.target.id !== 'srcs') return;
  e.preventDefault();
  const ok = DATA.sources.filter((s) => s.ok).length;
  $('dlgbody').innerHTML = `<p style="color:var(--muted);font-size:14px">Работает ${ok} из ${DATA.sources.length}. Всего записей: ${DATA.rawCount}, после удаления повторов: ${DATA.news.length}</p><ul class="srclist">` +
    DATA.sources.map((s) => `<li class="${s.ok ? 'ok' : 'bad'}">${s.ok ? '●' : '○'} ${esc(s.name)}${s.ok ? ` (${s.count})` : ''}</li>`).join('') + '</ul>';
  $('dlg').showModal();
};
(async () => { await fetchData(); load(true); })();
setInterval(async () => { await fetchData(); load(true); }, 10 * 60 * 1000);
</script>
</body>
</html>
